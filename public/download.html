<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تحميل الصور</title>
<style>
body{font-family:sans-serif;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{border:1px solid #ddd;border-radius:8px;padding:8px;text-align:center}
.card img{width:100%;height:160px;object-fit:cover;border-radius:6px}
button{padding:10px 16px;margin:8px 4px;cursor:pointer}
</style>
</head>
<body>
<h2>صورك المطابقة</h2>
<div>
<button id="selectAll">اختيار الكل</button>
<button id="downloadSelected">تحميل المحدد</button>
</div>
<div class="grid" id="grid"></div>
<script>
const params = new URLSearchParams(location.search);
const token = params.get("token");
const grid = document.getElementById("grid");
let items = [];
fetch("/api/download-sessions/" + encodeURIComponent(token))
  .then(r => r.json())
  .then(data => {
    items = data.items || [];
    items.forEach((item, idx) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<input type="checkbox" data-idx="${idx}" checked> <br><img src="${item.url}" alt=""><br><small>${item.filename}</small>`;
      grid.appendChild(card);
    });
  });
document.getElementById("selectAll").onclick = () => {
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
};
document.getElementById("downloadSelected").onclick = async () => {
  const selected = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(cb => Number(cb.dataset.idx));
  for (const idx of selected) {
    const a = document.createElement("a");
    a.href = items[idx].url;
    a.download = items[idx].filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    await new Promise(r => setTimeout(r, 700));
  }
};
</script>
</body>
</html>
